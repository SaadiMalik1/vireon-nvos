name: CI

on:
  push:
    branches: [ "main", "svp/**", "abc/**" ]
  pull_request:
    branches: [ "main", "svp/**", "abc/**" ]

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install hypothesis pytest pytest-cov
        pip install -e .
    - name: Regenerate seed registry
      run: python scripts/regenerate_seed_registry.py
    - name: Run unit tests
      env:
        VIREON_HOME: ${{ github.workspace }}
        MPLBACKEND: Agg
      run: |
        pytest --tb=short -q
  
  integration-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install hypothesis pytest
        pip install -e .
    - name: Run integration tests
      env:
        MPLBACKEND: Agg
      run: |
        pytest tests/test_integration_evidence_pipeline.py -v --tb=long
    
    - name: Download PhysioNet test data
      run: |
        python -c "
        import time, mne
        for attempt in range(5):
            try:
                mne.datasets.eegbci.load_data(1, [4, 8, 12], update_path=True, verbose=False)
                break
            except Exception as e:
                print(f'Attempt {attempt+1} failed: {e}. Retrying in 5s...')
                time.sleep(5)
        else:
            raise RuntimeError('PhysioNet download failed after 5 attempts.')
        "
    - name: Run literature reproduction tests
      run: |
        pytest vireon-verification/literature/ -v

    - name: Run doc sync checker
      run: |
        python scripts/check_doc_sync.py
    
    - name: Verify no fake evidence hashes
      run: |
        PATTERNS=(
          'evidence_hash\s*=\s*""'
          'evidence_hash\s*=\s*["'\'']dummy["'\'']'
          'evidence_hash\s*=\s*["'\'']realtime_.*_hash["'\'']'
          'evidence_hash\s*=\s*["'\'']regulatory_.*_hash["'\'']'
          'execution_hash\s*=\s*["'\'']dummy["'\'']'
        )
        for pattern in "${PATTERNS[@]}"; do
          matches=$(grep -rnE "$pattern" vireon-*/ examples/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "FAIL: Found fake hash pattern: $pattern"
            echo "$matches"
            exit 1
          fi
        done
        echo "All hash patterns clean."

    - name: Verify evidence hash integrity
      run: |
        python3 scripts/verify_hash_integrity.py

    - name: Verify no regressions (grep gates)
      run: |
        # No fake parquet
        ! rg "PARQUET_STUB_DATA" vireon-validation/
        # No fabricated failure counts
        ! rg "failures_logged.*int\(total_runs" vireon-validation/
        # No unseeded np.random in perturbations
        ! rg "np\.random\.(normal|uniform|choice)" vireon-validation/vireon_validation/perturbations/
        # No "fully integrated" overclaim
        echo "All grep gates passed"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy vireon-core/ vireon-methods/ --ignore-missing-imports

  algorithm-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install hypothesis pytest pytest-cov mne-bids pyarrow
        pip install -e .
    - name: Run algorithm validation suite
      env:
        MPLBACKEND: Agg
      run: |
        pytest tests/test_algorithm_validation_suite/ -v --tb=short
    - name: Generate validation report
      run: |
        python scripts/generate_algorithm_validation_report.py
    - name: Upload validation report
      uses: actions/upload-artifact@v4
      with:
        name: algorithm-validation-report
        path: reports/
