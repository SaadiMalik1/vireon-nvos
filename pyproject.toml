[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vireon-nvos"
version = "1.1.0"
description = "VIREON — Neurotechnology Validation Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VIREON Authors"}
]
keywords = ["eeg", "bci", "neuroscience", "validation", "signal-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "mne>=1.5.0,<2.0.0",
    "mne-bids>=0.14.0,<1.0.0",
    "edfio>=0.4.0,<1.0.0",
    "pydantic>=2.4.0,<3.0.0",
    "networkx>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.100.0,<1.0.0",
    "httpx>=0.24.0,<1.0.0",
    "threadpoolctl>=3.0,<4.0",
    "uvicorn[standard]>=0.24.0,<1.0.0"
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
deep-learning = ["torch>=2.0"]
dev = ["pytest>=7.0", "pytest-cov", "hypothesis>=6.0", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
vireon = "vireon_simple.cli:main"
vireon-mcp = "vireon_mcp.server:main"

[project.urls]
Repository = "https://github.com/SaadiMalik1/vireon-nvos"
Issues = "https://github.com/SaadiMalik1/vireon-nvos/issues"

[tool.setuptools.packages.find]
where = [
    "vireon-core",
    "vireon-models",
    "vireon-methods",
    "vireon-knowledge",
    "vireon-validation",
    "vireon-lab",
    "vireon-corpus",
    "vireon-evidence",
    "vireon-api",
    "vireon-verification",
    "vireon-simple",
    "vireon-mcp"
]
include = ["vireon_*"]

[project.entry-points."vireon.plugins"]
test_plugin = "vireon_core.kernel.plugins:SampleDiscoveryPlugin"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "vireon-core/tests",
    "vireon-models/tests",
    "vireon-lab/tests",
    "vireon-methods/tests",
    "vireon-validation/tests",
    "vireon-evidence/tests",
    "vireon-knowledge/tests",
    "vireon-corpus/tests",
    "vireon-api/tests",
    "vireon-verification",
    "vireon-simple/tests",
    "vireon-mcp/tests"
]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
    "env",
    "benchmarks/output",
    "results",
    "evidence_output"
]
pythonpath = [
    ".",
    "vireon-core",
    "vireon-models",
    "vireon-lab",
    "vireon-methods",
    "vireon-validation",
    "vireon-evidence",
    "vireon-knowledge",
    "vireon-corpus",
    "vireon-api",
    "vireon-verification",
    "vireon-simple",
    "vireon-mcp"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E401", "E402", "E501", "E701", "E731", "E741", "F401", "F403", "F841"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
implicit_optional = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["site/", "build/", "dist/"]

[tool.coverage.run]
source = ["vireon_core", "vireon_methods", "vireon_validation", "vireon_evidence"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass"
]

[[tool.mypy.overrides]]
module = [
    "vireon_methods.*",
    "vireon_core.kernel.execution_engine",
    "vireon_core.kernel.plugins"
]
ignore_errors = true
