[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vireon-nvos"
version = "1.0.3"
description = "VIREON — Neurotechnology Validation Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VIREON Authors"}
]
keywords = ["eeg", "bci", "neuroscience", "validation", "signal-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "mne",
    "mne-bids",
    "edfio",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "pyyaml",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "threadpoolctl>=3.0",
    "uvicorn[standard]>=0.24.0"
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
deep-learning = ["torch>=2.0"]
dev = ["pytest>=7.0", "pytest-cov", "hypothesis>=6.0"]

[project.scripts]
vireon = "vireon_lab.cli.main:main"

[project.urls]
Repository = "https://github.com/SaadiMalik1/vireon-nvos"
Issues = "https://github.com/SaadiMalik1/vireon-nvos/issues"

[tool.setuptools.packages.find]
where = [
    "vireon-core",
    "vireon-models",
    "vireon-methods",
    "vireon-knowledge",
    "vireon-validation",
    "vireon-lab",
    "vireon-corpus",
    "vireon-evidence",
    "vireon-api",
    "vireon-verification"
]
include = ["vireon_*"]

[project.entry-points."vireon.plugins"]
test_plugin = "vireon_core.kernel.plugins:SampleDiscoveryPlugin"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "vireon-core/tests",
    "vireon-models/tests",
    "vireon-lab/tests",
    "vireon-methods/tests",
    "vireon-validation/tests",
    "vireon-evidence/tests",
    "vireon-knowledge/tests",
    "vireon-corpus/tests",
    "vireon-api/tests",
    "vireon-verification"
]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
    "env",
    "benchmarks/output",
    "results",
    "evidence_output"
]
pythonpath = [
    ".",
    "vireon-core",
    "vireon-models",
    "vireon-lab",
    "vireon-methods",
    "vireon-validation",
    "vireon-evidence",
    "vireon-knowledge",
    "vireon-corpus",
    "vireon-api",
    "vireon-verification"
]
